<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<title>NexGent Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
/* Layout: sidebar de navegación + área de trabajo; en móvil, pestañas arriba */
:root{
  --ink:#151711; --teal:#82CBD4; --teal-deep:#2F8F9B;
  --bg:#F5F6F3; --surface:#FFFFFF; --surface-2:#EEF0EB; --line:#E1E4DD;
  --fg:#151711; --muted:#62675D; --accent:#2F8F9B; --accent-soft:#E3F3F5;
  --ok:#2E7D4F; --ok-soft:#E4F2E8; --warn:#A8660B; --warn-soft:#FBF0DC; --bad:#B3372C; --bad-soft:#F8E4E1;
  --side:#151711; --side-fg:#E9ECE5; --side-muted:#8E9488;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F110D; --surface:#181B15; --surface-2:#20241C; --line:#2C3127;
  --fg:#ECEFE8; --muted:#9BA196; --accent:#82CBD4; --accent-soft:#1B3236;
  --ok:#7CC79A; --ok-soft:#1A2E21; --warn:#E3B062; --warn-soft:#33281A; --bad:#EE8E84; --bad-soft:#3A1F1C;
  --side:#0A0B09; --side-fg:#E9ECE5; --side-muted:#80867B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F110D; --surface:#181B15; --surface-2:#20241C; --line:#2C3127;
  --fg:#ECEFE8; --muted:#9BA196; --accent:#82CBD4; --accent-soft:#1B3236;
  --ok:#7CC79A; --ok-soft:#1A2E21; --warn:#E3B062; --warn-soft:#33281A; --bad:#EE8E84; --bad-soft:#3A1F1C;
  --side:#0A0B09; --side-fg:#E9ECE5; --side-muted:#80867B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--side);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{padding:6px 12px 4px;display:flex;align-items:center}
.brand img{height:28px;width:auto}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--side-muted);font-weight:600;font-size:13.5px}
nav button:hover{color:var(--side-fg);background:rgba(255,255,255,.05)}
nav button[aria-current="page"]{color:var(--ink);background:var(--teal)}
nav button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
nav svg{width:17px;height:17px;flex:none}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);line-height:1.5}
.side-foot b{color:var(--side-fg);font-weight:600}
main{padding-block:28px 60px;padding-inline:clamp(16px,3.5vw,44px);min-width:0;max-width:1180px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
h2{font-size:15px;font-weight:700;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:13px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme="dark"] .btn.primary{background:var(--teal);color:var(--ink);border-color:var(--teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--teal);color:var(--ink);border-color:var(--teal)}}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.qbar{display:flex;gap:6px;flex-wrap:wrap}
.qbar button{font:inherit;font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.qbar button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qbar select{width:auto;font:inherit;font-weight:700;font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
/* resumen */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--f-num);font-size:22px;font-weight:600;letter-spacing:-.01em}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.hl .lab,.kpi.hl .hint{color:#A9D9DF}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.m303{padding:6px 18px 16px}
.m303 .l{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);gap:12px}
.m303 .l:last-child{border-bottom:0;font-weight:800;font-size:15px}
.m303 .box{font-family:var(--f-num);font-size:11px;color:var(--muted);margin-right:6px}
.alerts{padding:6px 18px 16px;display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--accent-soft);color:var(--fg)}
.alert b{font-weight:700}
/* tablas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .s{display:block;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mut{background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
tfoot td{font-weight:800;background:var(--surface-2);cursor:default}
/* formularios */
.drawer-bg{position:fixed;inset:0;background:rgba(10,11,9,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(860px,100%);height:100%;overflow:auto;padding-block:22px 40px;padding-inline:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:18px;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.drawer .head{margin:0}
fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 4;min-width:0}
.f.w2{grid-column:span 2}.f.w3{grid-column:span 3}.f.w6{grid-column:span 6}.f.w8{grid-column:span 8}.f.w12{grid-column:span 12}
label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:inherit;font-size:14px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input.num{text-align:right}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.2fr) 70px 80px 36px;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.item .c{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .c input:last-child{font-size:12.5px;padding:6px 10px}
.totals{margin-left:auto;width:min(320px,100%);display:flex;flex-direction:column;gap:4px}
.totals div{display:flex;justify-content:space-between;padding:6px 2px}
.totals .t{background:var(--teal);color:var(--ink);border-radius:8px;padding:10px 12px;font-weight:800;font-size:16px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.login{max-width:460px;margin:8vh auto 0;padding:24px}
.linkbtn{all:unset;cursor:pointer;color:var(--side-fg);text-decoration:underline}
nav button:disabled{opacity:.35;pointer-events:none}
.small{font-size:12px}
.tip{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.tip code{font-family:var(--f-num);font-size:12px;color:var(--fg)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:16px;font-weight:600;font-size:13px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;z-index:10;overflow-x:auto}
  .brand{padding:0}.brand img{height:20px}
  nav{flex-direction:row}
  nav button{padding:7px 10px;font-size:12.5px}
  nav button span{display:none}
  nav button[aria-current="page"] span{display:inline}
  .side-foot{display:none}
  .f,.f.w2,.f.w3,.f.w6,.f.w8{grid-column:span 12}
  .item{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px}
  .item .c{grid-column:1/-1}
  .kpi .val{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

</head>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:2,useGrouping:"always"}).format(r2(n));
const eurP=n=>{const s=r2(n).toFixed(2).split(".");return s[0].replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+s[1]+" €";};
const fdate=d=>d?d.split("-").reverse().join("/"):"";
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const qOf=d=>{const [y,m]=d.split("-").map(Number);return {y,q:Math.floor((m-1)/3)+1};};
const inQ=(d,y,q)=>{if(!d)return false;const o=qOf(d);return o.y===y&&o.q===q;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const CATS=["Software y suscripciones","Servidores y hosting","Publicidad","Material y equipos","Servicios profesionales","Viajes y dietas","Formación","Oficina y suministros","Comisiones bancarias","Otros"];

const S={view:"resumen",y:null,q:null,company:null,companyV:null,clients:[],invoices:[],expenses:[],db:null,assets:null,dl:null,canWrite:true,loaded:{c:false,cl:false,i:false,e:false},noDb:false};
{const n=new Date();S.y=n.getFullYear();S.q=Math.floor(n.getMonth()/3)+1;}

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function errMsg(e){const c=e&&e.code;if(c==="invalid_argument")return "No tienes permiso para guardar aquí, o un dato no es válido.";if(c==="quota_exceeded")return "Se ha llenado el espacio de la base de datos.";return "No se pudo guardar. Inténtalo de nuevo.";}

function invTotals(inv){let base=0,iva=0,irpf=0;for(const it of inv.items||[]){const b=r2((+it.price||0)*(+it.qty||0));base+=b;iva+=r2(b*(+it.vat||0)/100);}
  if(+inv.irpf)irpf=r2(base*(+inv.irpf)/100);base=r2(base);iva=r2(iva);return {base,iva,irpf,total:r2(base+iva-irpf)};}
function invStatus(inv){if(inv.status==="pagada")return ["Pagada","ok"];if(inv.status==="anulada")return ["Anulada","mut"];if(inv.due&&inv.due<today())return ["Vencida","bad"];return ["Pendiente","warn"];}
function expVat(e){return e.vatAmount!=null&&e.vatAmount!==""?r2(e.vatAmount):r2((+e.base||0)*(+e.vat||0)/100);}
function expTotal(e){return e.total!=null&&e.total!==""?r2(e.total):r2((+e.base||0)+expVat(e));}
function quarterData(y,q){
  const inv=S.invoices.filter(i=>i.status!=="anulada"&&inQ(i.date,y,q));
  const exp=S.expenses.filter(e=>inQ(e.date,y,q));
  const I={base:0,iva:0,total:0,cobrado:0},E={base:0,iva:0,total:0,sinPdf:0,intra:0};
  inv.forEach(i=>{const t=invTotals(i);I.base+=t.base;I.iva+=t.iva;I.total+=t.total;if(i.status==="pagada")I.cobrado+=t.total;});
  exp.forEach(e=>{E.base+=+e.base||0;if(e.deductible!==false&&!e.reverseCharge)E.iva+=expVat(e);E.total+=expTotal(e);if(!e.assetId)E.sinPdf++;if(e.reverseCharge)E.intra+=+e.base||0;});
  for(const o of [I,E])for(const k in o)o[k]=r2(o[k]);
  return {inv,exp,I,E};
}
function nextNumber(){const c=S.company||{};const pref=c.series||("F"+String(S.y).slice(2));const used=S.invoices.map(i=>i.number).filter(n=>n&&n.startsWith(pref)).map(n=>parseInt(n.slice(pref.length),10)).filter(n=>!isNaN(n));
  const n=Math.max(used.length?Math.max(...used)+1:1,+c.nextNumber||1);return pref+String(n).padStart(3,"0");}

const SBDB=(()=>{const subs={};
  const snapOf=(id,data)=>({id,exists:data!==undefined,data:()=>data,metadata:{}});
  const refresh=async col=>{const s=subs[col];if(!s)return;const {data,error}=await sb.from("docs").select("id,data").eq("collection",col).limit(5000);if(error){s.err.forEach(f=>f(error));return;}
    const docs=data.map(r=>snapOf(r.id,r.data));s.list.forEach(f=>f({docs,size:docs.length,empty:!docs.length}));s.single.forEach(([id,f])=>{const r=data.find(x=>x.id===id);f(snapOf(id,r?r.data:undefined));});};
  const ensure=col=>{if(subs[col])return subs[col];const s=subs[col]={list:[],single:[],err:[]};
    s.ch=sb.channel("docs-"+col).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"collection=eq."+col},()=>refresh(col)).subscribe();return s;};
  const fail=error=>{throw {code:error.code==="42501"?"invalid_argument":"unavailable",message:error.message};};
  const ref=(col,id)=>({id,path:col+"/"+id,
    async get(){const {data,error}=await sb.from("docs").select("data").eq("collection",col).eq("id",id).maybeSingle();if(error)fail(error);return snapOf(id,data?data.data:undefined);},
    async set(d){const {error}=await sb.from("docs").upsert({collection:col,id,data:d});if(error)fail(error);refresh(col);},
    async update(d){const cur=await this.get();const {error}=await sb.from("docs").upsert({collection:col,id,data:{...(cur.data()||{}),...d}});if(error)fail(error);refresh(col);},
    async delete(){const {error}=await sb.from("docs").delete().eq("collection",col).eq("id",id);if(error)fail(error);refresh(col);},
    onSnapshot(f,e){const s=ensure(col);s.single.push([id,f]);if(e)s.err.push(e);refresh(col);return()=>{s.single=s.single.filter(x=>x[1]!==f);};}});
  return {doc(path){const [c,i]=path.split("/");return ref(c,i);},
    collection(col){return {doc:id=>ref(col,id||uid()),onSnapshot(f,e){const s=ensure(col);s.list.push(f);if(e)s.err.push(e);refresh(col);return()=>{s.list=s.list.filter(x=>x!==f);};}};}};})();

       if(isNew&&S.company){const pref=S.company.series||"";const n=parseInt(d.number.slice(pref.length),10);if(!isNaN(n)&&n+1>(+S.company.nextNumber||0))await S.db.doc("settings/company").update({nextNumber:n+1});}

  };

/* PDF de factura (mismo diseño que la F26002) */
function buildPdf(d){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"a4"});const W=595.28,H=841.89,L=48,R=W-48;
  const c=S.company||{};const t=invTotals(d);
  const DARK=[21,23,17],TEAL=[130,203,212],TL=[230,244,246],GREY=[107,111,102];
  const fill=a=>doc.setFillColor(...a),col=a=>doc.setTextColor(...a),font=(w,s)=>{doc.setFont("helvetica",w);doc.setFontSize(s);};
  const Y=y=>H-y; // coordenadas desde abajo como en el diseño original
  fill(DARK);doc.rect(0,0,W,10,"F");fill(TEAL);doc.rect(0,10,W*.35,4,"F");
  try{doc.addImage(LOGO_PDF,"PNG",L,Y(H-95)-37.5,150,37.5);}catch(e){}
  col(DARK);font("bold",28);doc.text("FACTURA",R,Y(H-70),{align:"right"});
  font("normal",10);col(GREY);doc.text("Nº "+d.number,R,Y(H-88),{align:"right"});
  const bw=(R-L-20)/3;[["FECHA DE EMISIÓN",fdate(d.date)],["VENCIMIENTO",fdate(d.due)],["IMPORTE TOTAL",eurP(t.total)]].forEach(([k,v],i)=>{const x=L+i*(bw+10),y=H-150;
    fill(i===2?DARK:TL);doc.roundedRect(x,Y(y+26),bw,44,6,6,"F");col(i===2?TEAL:GREY);font("bold",7);doc.text(k,x+12,Y(y+12));col(i===2?[255,255,255]:DARK);font("bold",12);doc.text(v,x+12,Y(y-6));});
  const block=(x,title,lines)=>{const y=H-215;fill(TEAL);doc.rect(x,Y(y+10),3,12,"F");col(GREY);font("bold",7.5);doc.text(title,x+9,Y(y));
    lines.filter(Boolean).forEach((s,i)=>{col(DARK);font(i===0?"bold":"normal",i?9:10);doc.text(String(s),x,Y(y-20-i*13));});};
  block(L,"EMISOR",[c.name,c.address,c.city,c.cif?"CIF: "+c.cif:"",[c.phone,c.email].filter(Boolean).join(" · ")]);
  const cl=d.client||{};block(W/2+20,"CLIENTE",[cl.name,cl.address,cl.city,cl.cif?"CIF: "+cl.cif:""]);
  let y=H-340;const cx={p:300,u:345,s:415,v:458};
  fill(DARK);doc.roundedRect(L,Y(y+17),R-L,26,5,5,"F");col([255,255,255]);font("bold",7.5);
  doc.text("CONCEPTO",L+12,Y(y));doc.text("PRECIO",cx.p,Y(y),{align:"right"});doc.text("UDS.",cx.u,Y(y),{align:"center"});doc.text("SUBTOTAL",cx.s,Y(y),{align:"right"});doc.text("IVA",cx.v,Y(y),{align:"center"});doc.text("TOTAL",R-12,Y(y),{align:"right"});
  y-=34;(d.items||[]).forEach((it,i)=>{const h=it.note?40:30;const b=r2(it.price*it.qty);
    if(i%2===1){fill([247,248,246]);doc.rect(L,Y(y+18),R-L,h,"F");}
    col(DARK);font("bold",9.5);doc.text(String(it.concept||""),L+12,Y(y));if(it.note){col(GREY);font("normal",8);doc.text(String(it.note),L+12,Y(y-13));}
    col(DARK);font("normal",9);doc.text(eurP(it.price),cx.p,Y(y),{align:"right"});doc.text(String(it.qty),cx.u,Y(y),{align:"center"});doc.text(eurP(b),cx.s,Y(y),{align:"right"});doc.text((+it.vat)+"%",cx.v,Y(y),{align:"center"});
    font("bold",9);doc.text(eurP(r2(b*(1+(+it.vat)/100))),R-12,Y(y),{align:"right"});y-=h;});
  doc.setDrawColor(227,229,224);doc.setLineWidth(1);doc.line(L,Y(y+12),R,Y(y+12));
  y-=18;const TX=W/2+30;const rows=[["Base imponible",t.base],["IVA",t.iva]];if(t.irpf)rows.push([`Retención IRPF (${d.irpf}%)`,-t.irpf]);
  rows.forEach(([k,v])=>{col(GREY);font("normal",9.5);doc.text(k,TX+12,Y(y));col(DARK);font("bold",9.5);doc.text(eurP(v),R-12,Y(y),{align:"right"});y-=20;});
  y-=12;fill(TEAL);doc.roundedRect(TX,Y(y+18),R-TX,34,6,6,"F");col(DARK);font("bold",11);doc.text("TOTAL",TX+12,Y(y-3));font("bold",15);doc.text(eurP(t.total),R-12,Y(y-4),{align:"right"});
  y-=60;if(d.notes){col(GREY);font("normal",8.5);const ls=doc.splitTextToSize(d.notes,R-L);doc.text(ls,L,Y(y));y-=ls.length*12+14;}
  y-=15;fill(TL);doc.roundedRect(L,Y(y+22),R-L,62,6,6,"F");fill(TEAL);doc.rect(L,Y(y+22),4,62,"F");
  col(DARK);font("bold",9.5);doc.text("Condiciones de pago",L+16,Y(y+4));col(GREY);font("normal",8.5);doc.text(`Pago por transferencia bancaria antes del ${fdate(d.due)} al siguiente número de cuenta:`,L+16,Y(y-11));
  col(DARK);font("bold",10.5);doc.text((c.iban||"").replace(/\s/g,"").replace(/(.{4})/g,"$1 ").trim(),L+16,Y(y-28));
  col(DARK);font("bold",11);doc.text(c.thanks||"Gracias por confiar en NexGent.",L,Y(120));
  fill(DARK);doc.rect(0,H-48,W,48,"F");fill(TEAL);doc.rect(W*.65,H-51,W*.35,3,"F");col([255,255,255]);font("normal",7.5);
  doc.text(`${d.number} · ${eurP(t.total)} · Vencimiento ${fdate(d.due)}`,L,Y(20));doc.text([c.web,c.email].filter(Boolean).join(" · "),W/2+30,Y(20),{align:"center"});doc.text("Pág. 1 de 1",R,Y(20),{align:"right"});
  doc.setProperties({title:`Factura ${d.number} - ${cl.name||""}`,author:c.name||""});
  return doc;
}
const safe=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_").replace(/^_|_$/g,"");
async function savePdf(d){if(!S.dl){toast("La descarga no está disponible.");return;}
  try{const blob=buildPdf(d).output("blob");await S.dl.save({filename:`Factura_${d.number}_${safe(d.client?.name)}.pdf`,data:blob});}
  catch(e){if(e&&e.code==="declined")return;toast("No se pudo generar el PDF.");}}

/* ---------- Importar gastos desde el correo (IMAP del webmail) ---------- */
function openImport(){
  const L=$("#layer");const st={y:S.y,q:S.q,all:false,list:null,sel:new Set(),busy:false,log:[],err:""};
  const done=new Set(S.expenses.map(e=>e.id));
  const range=()=>{const m0=(st.q-1)*3+1;const a=`${st.y}-${String(m0).padStart(2,"0")}-01`;const b=st.q===4?`${st.y+1}-01-01`:`${st.y}-${String(m0+3).padStart(2,"0")}-01`;return [a,b];};
  const draw=()=>{const items=st.list||[];
   L.innerHTML=`<div class="drawer-bg"><div class="drawer" role="dialog" aria-label="Importar del correo">
   <div class="head"><div><h1>Importar gastos del correo</h1><p class="sub">Busca facturas en ${esc(S.mailbox||"tu buzón")}, guarda los PDF adjuntos y lee los importes.</p></div><div class="row"><button class="btn ghost" id="x">Cerrar</button></div></div>
   <div class="panel" style="padding:16px;display:flex;flex-direction:column;gap:12px">

     <div class="f w3"><label for="m_y">Año</label><input id="m_y" class="num" type="number" value="${st.y}"></div>
     <div class="f w6" style="justify-content:flex-end"><label><input type="checkbox" id="m_all" ${st.all?"checked":""} style="width:auto;margin-right:6px">Mostrar todos los correos del trimestre, no solo los que parecen facturas</label></div>
    </fieldset>
    <div class="row"><button class="btn primary" id="go" ${st.busy?"disabled":""}>${st.busy&&!st.list?"Buscando…":st.list?"Buscar de nuevo":"Buscar en el correo"}</button>${S.ai===false?`<span class="small muted">Los importes se leen del PDF automáticamente; revisa cada gasto importado.</span>`:""}</div>
    ${st.err?`<div class="alert warn">${esc(st.err)}</div>`:""}
   </div>
   ${st.list?`<div class="panel"><div class="card-h"><h2>${items.length} correo${items.length!==1?"s":""} encontrado${items.length!==1?"s":""}</h2>
     <div class="row"><button class="btn ghost" id="all">Marcar todos</button><button class="btn primary" id="imp" ${st.busy||!st.sel.size?"disabled":""}>Importar ${st.sel.size||""}</button></div></div>
     ${items.length?`<div class="tw"><table><tbody>${items.map(m=>{const was=done.has(m.id);const lg=st.log.find(x=>x.id===m.id);return `<tr style="cursor:default"><td style="width:30px"><input type="checkbox" data-m="${esc(m.id)}" aria-label="Seleccionar" ${st.sel.has(m.id)?"checked":""} ${was||st.busy?"disabled":""} style="width:auto"></td>
      <td class="num small" style="white-space:nowrap">${fdate(m.date.slice(0,10))}</td><td><b>${esc(m.subject||"(sin asunto)")}</b><span class="s">${esc(m.sender)}</span></td>
      <td class="r" style="white-space:nowrap">${m.hasPdf?`<span class="pill mut">PDF</span> `:""}${was?`<span class="pill ok">Ya importado</span>`:lg?`<span class="pill ${lg.cls}">${esc(lg.msg)}</span>`:""}</td></tr>`;}).join("")}</tbody></table></div>`
     :`<div class="empty"><b>No hay correos con facturas en ese trimestre</b>Marca «Mostrar todos los correos» o cambia de trimestre.</div>`}
   </div>`:""}
   <div class="tip">Se revisa la bandeja de entrada de tu webmail. Si el correo trae un PDF, se guarda junto al gasto; si la factura solo está en un enlace, el gasto queda como «Falta PDF». Revisa los marcados como «Revisar»: son lecturas con dudas o importes en otra moneda.</div>
   </div></div>`;bind();};
  const bind=()=>{$("#x").onclick=()=>L.innerHTML="";
   $("#m_q").onchange=e=>{st.q=+e.target.value;draw();};$("#m_y").onchange=e=>{st.y=+e.target.value||st.y;draw();};$("#m_all").onchange=e=>{st.all=e.target.checked;draw();};
   $("#go").onclick=search;
   L.querySelectorAll("[data-m]").forEach(cb=>cb.onchange=()=>{cb.checked?st.sel.add(cb.dataset.m):st.sel.delete(cb.dataset.m);draw();});
   const all=$("#all");if(all)all.onclick=()=>{(st.list||[]).forEach(m=>{if(!done.has(m.id))st.sel.add(m.id);});draw();};
   const imp=$("#imp");if(imp)imp.onclick=runImport;};
  async function search(){st.busy=true;st.err="";st.list=null;st.sel.clear();draw();const [a,b]=range();
    try{const r=await api(`/api/mail/search?from=${a}&to=${b}${st.all?"&all=1":""}`);st.list=r.items;r.items.forEach(m=>{if(!done.has(m.id)&&(m.hasPdf||!st.all))st.sel.add(m.id);});}
    catch(e){st.err=e.code==="imap_not_configured"?"Falta conectar el correo: añade IMAP_HOST, IMAP_USER e IMAP_PASSWORD en las variables de entorno de Vercel.":e.message;}
    st.busy=false;draw();}
  async function runImport(){st.busy=true;const ids=[...st.sel];st.log=[];draw();let ok=0,skip=0,fail=0;
    for(const id of ids){const m=st.list.find(x=>x.id===id);const setLog=(msg,cls)=>{st.log=st.log.filter(x=>x.id!==id).concat([{id,msg,cls}]);draw();};
     setLog("Leyendo…","mut");
     try{const r=await api("/api/mail/import",{method:"POST",body:JSON.stringify({id,folder:m.folder,uid:m.uid})});
      if(r.status==="skipped"){skip++;setLog("No es una factura de gasto","mut");}
      else if(r.status==="duplicate"){done.add(id);setLog("Ya importado","ok");}
      else{ok++;done.add(id);st.sel.delete(id);setLog(r.hasPdf?(r.needsReview?"Importado · revisar":"Importado con PDF"):"Importado · sin PDF",r.hasPdf&&!r.needsReview?"ok":"warn");}}
     catch(e){fail++;setLog((e.message||"Error").slice(0,60),"bad");}}
    st.busy=false;draw();toast(`${ok} gasto${ok!==1?"s":""} importado${ok!==1?"s":""}${skip?` · ${skip} descartado${skip!==1?"s":""}`:""}${fail?` · ${fail} con error`:""}`);}
  draw();
}

/* Clientes */
function vClientes(){return `<div class="head"><div><h1>Clientes</h1><p class="sub">Sus datos fiscales se copian en cada factura.</p></div><button class="btn primary" id="new" ${S.canWrite?"":"disabled"}>+ Nuevo cliente</button></div>
 <div class="panel">${S.clients.length?`<div class="tw"><table><thead><tr><th>Cliente</th><th>CIF</th><th>Dirección</th><th class="r">Facturado total</th><th class="r">Pendiente</th></tr></thead><tbody>
 ${S.clients.map(c=>{const inv=S.invoices.filter(i=>i.clientId===c.id&&i.status!=="anulada");const tot=inv.reduce((a,i)=>a+invTotals(i).total,0);const pen=inv.filter(i=>i.status!=="pagada").reduce((a,i)=>a+invTotals(i).total,0);
  return `<tr data-cl="${esc(c.id)}"><td><b>${esc(c.name)}</b><span class="s">${esc(c.email||"")}</span></td><td class="num">${esc(c.cif)}</td><td>${esc(c.address)}<span class="s">${esc(c.city)}</span></td><td class="r num">${eur(tot)}</td><td class="r num">${pen?`<span class="pill warn">${eur(pen)}</span>`:"—"}</td></tr>`;}).join("")}
 </tbody></table></div>`:`<div class="empty"><b>Aún no tienes clientes</b>Crea uno para poder emitirle facturas.</div>`}</div>`;}
function bClientes(m){const n=$("#new",m);if(n)n.onclick=()=>openClient(null);m.querySelectorAll("[data-cl]").forEach(r=>r.onclick=()=>openClient(S.clients.find(c=>c.id===r.dataset.cl)));}
function openClient(cl){const isNew=!cl;const d=cl?{...cl}:{id:uid(),name:"",cif:"",address:"",city:"",email:""};const L=$("#layer");
  L.innerHTML=`<div class="drawer-bg"><div class="drawer" role="dialog" aria-label="Cliente"><div class="head"><div><h1>${isNew?"Nuevo cliente":esc(d.name)}</h1></div><div class="row"><button class="btn ghost" id="x">Cerrar</button><button class="btn primary" id="save" ${S.canWrite?"":"disabled"}>Guardar</button></div></div>
  <div class="panel" style="padding:16px"><fieldset>
   <div class="f w8"><label for="c_name">Razón social</label><input id="c_name" value="${esc(d.name)}"></div>
   <div class="f w4"><label for="c_cif">CIF / NIF</label><input id="c_cif" value="${esc(d.cif)}"></div>
   <div class="f w6"><label for="c_addr">Dirección</label><input id="c_addr" value="${esc(d.address)}"></div>
   <div class="f w6"><label for="c_city">Ciudad (CP), provincia</label><input id="c_city" value="${esc(d.city)}" placeholder="Barcelona (08022), Barcelona"></div>
   <div class="f w6"><label for="c_mail">Email de facturación</label><input id="c_mail" type="email" value="${esc(d.email)}"></div>
  </fieldset></div></div></div>`;
  $("#x").onclick=()=>L.innerHTML="";
  $("#save").onclick=async()=>{d.name=$("#c_name").value.trim();d.cif=$("#c_cif").value.trim();d.address=$("#c_addr").value.trim();d.city=$("#c_city").value.trim();d.email=$("#c_mail").value.trim();
   if(!d.name||!d.cif){toast("Falta la razón social o el CIF.");return;}
   try{const body={...d};delete body.id;await S.db.collection("clients").doc(d.id).set(body);toast("Cliente guardado");L.innerHTML="";}catch(e){toast(errMsg(e));}};}

 return `<div class="head"><div><h1>Ajustes</h1><p class="sub">Los datos de tu empresa que salen en cada factura.</p></div><button class="btn primary" id="save" ${S.canWrite?"":"disabled"}>Guardar ajustes</button></div>
 <div class="panel" style="padding:16px;margin-bottom:16px"><fieldset>
  ${F("s_name","Razón social",c.name,"w8")}${F("s_cif","CIF",c.cif,"w4")}
  ${F("s_addr","Dirección",c.address)}${F("s_city","Ciudad (CP), provincia, país",c.city)}
  ${F("s_phone","Teléfono",c.phone,"w4")}${F("s_mail","Email",c.email,"w4")}${F("s_web","Web",c.web,"w4")}
  ${F("s_iban","IBAN para cobros",c.iban,"w8")}${F("s_series","Serie de numeración",c.series,"w2","F26")}<div class="f w2"><label for="s_next">Siguiente nº</label><input id="s_next" class="num" type="number" value="${esc(c.nextNumber||1)}"></div>

 </fieldset></div>

function bAjustes(m){const b=$("#save",m);if(b)b.onclick=async()=>{const g=id=>$("#"+id,m).value.trim();
  const body={...(S.company||{}),name:g("s_name"),cif:g("s_cif"),address:g("s_addr"),city:g("s_city"),phone:g("s_phone"),email:g("s_mail"),web:g("s_web"),iban:g("s_iban").replace(/\s/g,""),series:g("s_series"),nextNumber:+g("s_next")||1,thanks:g("s_thanks")};
  try{await S.db.doc("settings/company").set(body);toast("Ajustes guardados");}catch(e){toast(errMsg(e));}};}

/* Exportación trimestral */
function csv(rows){return "﻿"+rows.map(r=>r.map(v=>{const s=typeof v==="number"?v.toFixed(2).replace(".",","):String(v??"");return /[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(";")).join("\r\n");}
async function exportZip(y,q,btn){if(!S.dl)return;const {inv,exp,I,E}=quarterData(y,q);btn.disabled=true;const old=btn.textContent;btn.textContent="Preparando…";
  try{const zip=new JSZip();const tag=`T${q}_${y}`;const fe=zip.folder("1_Facturas_emitidas"),fr=zip.folder("2_Facturas_recibidas");
   for(const i of inv)fe.file(`${i.number}_${safe(i.client?.name)}.pdf`,buildPdf(i).output("arraybuffer"));
   const miss=[];for(const e of exp){if(!e.assetId){miss.push(e);continue;}try{const blob=await assetBlob(e.assetId);const ext=(e.assetName||"").split(".").pop()||"pdf";fr.file(`${e.date}_${safe(e.supplier)}${e.number?"_"+safe(e.number):""}.${ext}`,await blob.arrayBuffer());}catch(_){miss.push(e);}}
   zip.file(`Libro_facturas_emitidas_${tag}.csv`,csv([["Número","Fecha","Vencimiento","Cliente","CIF cliente","Base imponible","Tipo IVA","Cuota IVA","Retención IRPF","Total","Estado"],...inv.map(i=>{const t=invTotals(i);return [i.number,fdate(i.date),fdate(i.due),i.client?.name,i.client?.cif,t.base,[...new Set(i.items.map(x=>x.vat+"%"))].join("/"),t.iva,t.irpf,t.total,invStatus(i)[0]];})]));
   zip.file(`Libro_facturas_recibidas_${tag}.csv`,csv([["Fecha","Proveedor","NIF proveedor","Nº factura","Concepto","Categoría","Base imponible","Tipo IVA","Cuota IVA","Total","Inversión sujeto pasivo","IVA deducible","PDF adjunto"],...exp.map(e=>[fdate(e.date),e.supplier,e.cif,e.number,e.concept,e.category,+e.base||0,e.reverseCharge?"ISP":(e.vat+"%"),e.reverseCharge?0:expVat(e),expTotal(e),e.reverseCharge?"Sí":"No",e.deductible!==false?"Sí":"No",e.assetId&&!miss.includes(e)?"Sí":"No"])]));
   const c=S.company||{};zip.file(`Resumen_${tag}.txt`,[`${c.name||""} · CIF ${c.cif||""}`,`Resumen del ${q}º trimestre de ${y}`,"",`FACTURAS EMITIDAS: ${inv.length}`,`  Base imponible: ${eurP(I.base)}`,`  IVA repercutido: ${eurP(I.iva)}`,`  Total facturado: ${eurP(I.total)}`,"",`FACTURAS RECIBIDAS: ${exp.length}`,`  Base imponible: ${eurP(E.base)}`,`  IVA soportado deducible: ${eurP(E.iva)}`,E.intra?`  Base con inversión del sujeto pasivo: ${eurP(E.intra)}`:null,"",`IVA estimado a liquidar (303): ${eurP(I.iva-E.iva)}`,`Resultado (ingresos - gastos): ${eurP(I.base-E.base)}`,"",miss.length?`FALTAN ${miss.length} FACTURAS DE GASTO EN PDF:\n`+miss.map(e=>`  - ${fdate(e.date)} ${e.supplier} ${eurP(expTotal(e))}${e.gmailUrl?"  "+e.gmailUrl:""}`).join("\n"):"Todas las facturas de gasto están adjuntas."].filter(x=>x!==null).join("\n"));
   const blob=await zip.generateAsync({type:"blob"});await S.dl.save({filename:`NexGent_${tag}_para_gestor.zip`,data:blob});
   if(miss.length)toast(`ZIP listo. Faltan ${miss.length} PDF de gastos (van listados en el resumen).`);}
  catch(e){if(!(e&&e.code==="declined"))toast("No se pudo preparar el ZIP.");}
  finally{btn.disabled=false;btn.textContent=old;}}

/* Arranque */
let booted=false;
async function boot(session){
  if(!session){S.db=null;booted=false;loginView();return;}
  if(booted)return;booted=true;
  document.querySelectorAll("#nav button").forEach(b=>b.disabled=false);
  S.email=session.user.email;
  const {data:ok,error}=await sb.rpc("is_allowed");
  if(error||!ok){booted=false;await sb.auth.signOut();loginView("El email "+esc(S.email)+" no tiene acceso a esta app.");return;}
  S.db=SBDB;S.assets=SBASSETS;S.dl=SBDL;S.mail=true;
  render();
  api("/api/status").then(r=>{S.ai=r.ai;S.imap=r.imap;S.mailbox=r.mailbox;}).catch(()=>{});
  const onErr=()=>{};
  S.db.doc("settings/company").onSnapshot(s=>{S.company=s.exists?s.data():null;S.loaded.c=true;render();},onErr);
  S.db.collection("clients").onSnapshot(s=>{S.clients=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));S.loaded.cl=true;render();},onErr);
  S.db.collection("invoices").onSnapshot(s=>{S.invoices=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.i=true;render();},onErr);
  S.db.collection("expenses").onSnapshot(s=>{S.expenses=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.e=true;render();},onErr);
}
sb.auth.onAuthStateChange((ev,session)=>{if(ev==="SIGNED_OUT"){booted=false;S.db=null;S.email=null;const ac=$("#acct");if(ac)ac.hidden=true;loginView();}else if(session)setTimeout(()=>boot(session),0);});
sb.auth.getSession().then(({data})=>boot(data.session));
</script>
